<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Profit Path{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>
  <div class="grid-glow glow-one"></div>
  <div class="grid-glow glow-two"></div>
  <div class="page-shell">
    <nav class="top-nav">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand-mark">PP</span>
        <span class="brand-copy">
          <strong>Profit Path</strong>
          <small>AIML Investment Guide</small>
        </span>
      </a>
      <div class="nav-links">
        <a class="{% if request.path == url_for('risk_page') %}active{% endif %}" href="{{ url_for('risk_page') }}">Risk</a>
        <a class="{% if request.path == url_for('predict_page') %}active{% endif %}" href="{{ url_for('predict_page') }}">Stock Prediction</a>
        <a class="{% if request.path == url_for('sip_page') %}active{% endif %}" href="{{ url_for('sip_page') }}">SIP</a>
        <a class="{% if request.path == url_for('portfolio_page') %}active{% endif %}" href="{{ url_for('portfolio_page') }}">Portfolio</a>
        <a class="{% if request.path == url_for('ipo_page') %}active{% endif %}" href="{{ url_for('ipo_page') }}">IPO GMP</a>
        <a class="{% if request.path == url_for('plans_page') %}active{% endif %}" href="{{ url_for('plans_page') }}">Investment Plans</a>
      </div>
      <div class="nav-status">
        <span class="status-dot"></span>
        <span>Long-Term Focus</span>
      </div>
    </nav>
    {% block content %}{% endblock %}
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
